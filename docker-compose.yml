# `docker compose up -d db`   -> only Postgres (for local development)
# `docker compose up --build` -> the whole stack (db + api + web); requires JWT_SECRET in .env
services:
  db:
    image: postgres:16-alpine
    container_name: moneybook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneybook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneybook_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-moneybook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - moneybook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneybook} -d ${POSTGRES_DB:-moneybook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: moneybook-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false # not needed when using Supabase (run: docker compose up --build api web)
    environment:
      NODE_ENV: production
      PORT: 3001
      # Defaults to the local `db` service; set DATABASE_URL/DIRECT_URL in .env to use Supabase instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://moneybook:moneybook_dev_password@db:5432/moneybook?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://moneybook:moneybook_dev_password@db:5432/moneybook?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: moneybook-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  moneybook_pgdata:
